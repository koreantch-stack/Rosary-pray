<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="묵주기도">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>묵주기도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f2;--fg:#2e2721;--dim:#6f6458;--line:#e3d9c8;--gold:#a8782a;--gold2:#e0a43a;--bead:#d9cdb9;--card:#ffffff;--soft:rgba(224,164,58,.13)}
body.dark{--bg:#15110e;--fg:#ece3d4;--dim:#8d8275;--line:#3a322b;--gold:#d2ad62;--gold2:#f6d68c;--bead:#4a4038;--card:#1e1915;--soft:rgba(210,173,98,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html.fs-large{font-size:20px}
html.fs-xlarge{font-size:25px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic',sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s;overflow:hidden}
.hidden{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px;flex:none}
.hd-title{font-size:.95rem;font-weight:500;color:var(--gold);letter-spacing:.02em;text-align:center;flex:1}
.hd-right{display:flex;gap:6px;order:2;flex:none}
#prevBtn{order:0;flex:none}
.hd-title{order:1;min-width:0}
html.fs-xlarge .hd-title{order:3;flex-basis:100%}
.corner{position:absolute;top:calc(env(safe-area-inset-top) + 10px)}
.corner.r{right:14px}
.corner.l{left:14px}
.modal.has-corner{padding-top:calc(env(safe-area-inset-top) + 2.2rem + 24px)}
.more-sets{margin-top:4px}
.hd-btn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:18px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden;cursor:pointer;padding:0 18px;min-height:0}
#rosary{flex:none;width:100%;max-width:520px;height:min(36vh, calc(min(100vw, 520px) * 0.98));margin-top:2px;display:block}
html.fs-xlarge #rosary{height:min(31vh, calc(min(100vw, 520px) * 0.98))}
.cord{stroke:var(--line);fill:none;stroke-width:1.2}
.ring{stroke:var(--line);fill:none;stroke-width:1}
.bead{fill:var(--bead);transition:fill .25s,opacity .25s}
.bead.done{fill:var(--gold);opacity:.5}
.bead.now{fill:var(--gold2);opacity:1;filter:url(#glow)}
.crossg rect{fill:var(--bead);transition:fill .25s}
.crossg.done rect{fill:var(--gold);opacity:.5}
.crossg.now rect{fill:var(--gold2);opacity:1}
#centerLabel{fill:var(--dim);font-size:28px;font-weight:700;text-anchor:middle;font-family:inherit}
.prayer{width:100%;max-width:520px;flex:1 1 0;overflow-y:auto;text-align:center;padding:4px 4px 12px;min-height:0}
.step-name{font-size:1.35rem;font-weight:700;color:var(--gold);margin:6px 0 2px}
.counter{font-size:1rem;font-weight:500;color:var(--dim);margin-bottom:8px}
.announce{font-size:1.05rem;font-weight:500;word-break:keep-all;line-height:1.75;margin:6px 0 12px;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.announce .set{color:var(--gold)}
.text{white-space:pre-line;font-size:1.12rem;line-height:1.8;font-weight:500;word-break:keep-all}
.text.resp{white-space:pre-wrap;text-align:left;display:inline-block;max-width:100%}
body.hidetext .text{display:none}
body.hidetext .step-name{font-size:1.8rem;margin-top:18px}
#next{width:100%;max-width:560px;margin:0 auto;border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);font-size:.95rem;font-weight:500;word-break:keep-all;color:var(--dim);line-height:1.65;text-align:center;cursor:pointer;flex:none}
#next .nd{color:var(--fg);margin-top:3px;font-size:.88em;line-height:1.45}

.ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:20;transition:opacity .45s}
.ov.fade{opacity:0}
.ov img{max-width:86vw;max-height:52vh;border-radius:6px;margin-bottom:20px;box-shadow:0 6px 24px rgba(60,40,20,.18)}
.ov-set{color:var(--gold);font-size:1.1rem;letter-spacing:.04em}
.ov-title{font-size:1.3rem;line-height:1.75;margin-top:10px;max-width:520px}
.ov-hint{color:var(--dim);font-size:.85rem;margin-top:16px;line-height:1.6}
#done .big{font-size:1.5rem;margin:10px 0 6px}

.modal{position:fixed;inset:0;background:var(--bg);z-index:26;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px);overflow-y:auto}
.ch-wrap{width:100%;max-width:420px;margin:auto 0}
.ch-title{font-size:1.4rem;color:var(--gold);margin-bottom:6px;text-align:center}
.ch-sub{color:var(--dim);font-size:.92rem;margin-bottom:18px;text-align:center;line-height:1.6}
.btn{display:block;width:100%;padding:14px 12px;margin:8px 0;font:inherit;font-size:1.02rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-align:center;line-height:1.4}
.btn.main{border-color:var(--gold);color:var(--gold)}
.btn small{display:block;color:var(--dim);font-size:.8rem;margin-top:3px}
.btn.link{background:none;border:none;color:var(--dim);font-size:.92rem;padding:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid2 .btn{margin:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

#cal{z-index:27}
.cal-box{width:100%;max-width:460px;font-size:min(1rem,19px)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-month{font-size:1.15em;font-weight:700;color:var(--gold)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:.8em;color:var(--dim);padding:4px 0}
.cal-wd.sun{color:#c0614f}
.cell{min-height:3.4em;border:1px solid var(--line);border-radius:8px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.cell.empty{border:none}
.cell.today{border:2px solid var(--gold)}
.cell.nov{background:var(--soft)}
.cell .num{font-size:.95em;font-weight:500}
.cell .tag{font-size:.68em;color:var(--dim)}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cell .dots i{width:7px;height:7px;border-radius:50%;display:block}
.cell .nv{font-size:.6em;color:var(--gold);white-space:nowrap}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.85em;color:var(--dim);margin:12px 0 4px}
.cal-stat{text-align:center;color:var(--dim);font-size:.88em;margin:6px 0}
.nov-box{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;text-align:center;line-height:1.7}
.nov-form{margin:4px 0}
.nov-box input[type=number]{width:4.2em;text-align:center}
.nov-box input{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0}

.cell{cursor:pointer}
.cell.empty{cursor:default}
.cell.miss{border-style:dashed}
.cell.skip{opacity:.55}
.cell .sk{font-size:.6em;color:#c0614f;white-space:nowrap}
#dlg{z-index:40;align-items:center}
#dlg .sheet{border-radius:16px;max-width:400px;width:calc(100% - 32px)}
.dlg-msg{white-space:pre-line;line-height:1.7;text-align:center;margin:8px 0 14px}
.dlg-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg-row2 .btn{margin:0}
.btn.danger{border-color:#b84a3e;color:#c0614f}
.btn:disabled{opacity:.4}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow-y:auto}
.sheet-title{font-size:1.1rem;color:var(--gold);margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:1rem}
.row small{display:block;color:var(--dim);font-size:.78rem;margin-top:2px}
select{font:inherit;font-size:.95rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none}
.sheet .btn{margin-top:10px}
textarea.code{display:block;width:100%;height:6.5rem;font:inherit;font-size:.78rem;line-height:1.4;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;resize:none;user-select:text;-webkit-user-select:text;word-break:break-all}
.about{text-align:center;line-height:1.7;margin:6px 0 4px}
.about small{display:block;color:var(--dim);font-size:.82rem}
</style>
</head>
<body>
<header>
  <button class="hd-btn" id="prevBtn">◀ 이전</button>
  <div class="hd-title" id="hdTitle"></div>
  <div class="hd-right">
    <button class="hd-btn" id="homeBtn">처음으로</button>
    <button class="hd-btn" id="setBtn">설정</button>
  </div>
</header>

<main id="main">
  <svg id="rosary" viewBox="0 0 340 350" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  <div class="prayer" id="prayer"></div>
</main>
<div id="next"></div>

<!-- 신비 안내 -->
<div id="overlay" class="ov hidden">
  <img id="ovImg" class="hidden" alt="">
  <div class="ov-set" id="ovSet"></div>
  <div class="ov-title" id="ovTitle"></div>
  <div class="ov-hint">화면을 누르면 넘어갑니다</div>
</div>

<!-- 마침 화면 -->
<div id="done" class="ov hidden">
  <div class="ov-set" id="doneSet"></div>
  <div class="big">오늘 묵주기도를 마쳤습니다</div>
  <div class="ov-hint" id="doneDate"></div>
  <div class="ch-wrap" style="margin-top:20px">
    <button class="btn" id="doneCal">묵주기도 달력 보기</button>
    <button class="btn" id="doneHome">처음 화면으로</button>
  </div>
</div>

<!-- 신비 선택 -->
<div id="chooser" class="modal has-corner hidden">
  <button class="hd-btn corner r" id="chSet">설정</button>
  <div class="ch-wrap" id="chooserBody"></div>
</div>

<!-- 묵주기도 달력 -->
<div id="cal" class="modal has-corner hidden">
  <button class="hd-btn corner l" id="calBack">◀ 닫기</button>
  <button class="hd-btn corner r" id="calSet">설정</button>
  <div class="cal-box">
    <div class="cal-head">
      <button class="hd-btn" id="calPrev">◀</button>
      <div class="cal-month" id="calMonth"></div>
      <button class="hd-btn" id="calNext">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend" id="calLegend"></div>
    <div class="cal-stat" id="calStat"></div>
    <div class="nov-box" id="novBox"></div>
    <button class="btn" id="calClose" style="margin-top:16px">닫기</button>
  </div>
</div>

<!-- 확인 창 / 날짜 체크 창 -->
<div id="dlg" class="panel hidden">
  <div class="sheet" id="dlgBody"></div>
</div>

<!-- 설정 -->
<div id="settings" class="panel hidden">
  <div class="sheet">
    <div class="sheet-title">설정</div>
    <label class="row"><span>글자 크기</span>
      <select id="sFs">
        <option value="normal">보통</option>
        <option value="large">크게</option>
        <option value="xlarge">아주 크게</option>
      </select>
    </label>
    <label class="row"><span>기도문 숨기기<small>외워서 바칠 때. 순서와 신비만 보입니다</small></span><input type="checkbox" id="sHide"></label>
    <label class="row"><span>성화 보기</span><input type="checkbox" id="sImg"></label>
    <label class="row"><span>어두운 화면<small>밤에 눈부시지 않게</small></span><input type="checkbox" id="sDark"></label>
    <label class="row"><span>구슬 넘길 때 진동<small>한 단이 끝나면 두 번 울립니다. 아이폰은 진동을 지원하지 않습니다</small></span><input type="checkbox" id="sVib"></label>
    <label class="row"><span>기도 중 화면 켜 두기</span><input type="checkbox" id="sWake"></label>
    <button class="btn" id="setCal">묵주기도 달력</button>
    <button class="btn" id="setBackup">기록 옮기기·보관하기<small>폰을 바꾸거나 앱을 다시 깔 때 달력 기록을 가져갑니다</small></button>
    <button class="btn" id="setPreload">성화 미리 저장<small>와이파이에서 한 번 눌러 두면 인터넷 없이도 성화가 보입니다</small></button>
    <button class="btn hidden" id="setInstall">앱처럼 설치하기<small>홈 화면에 묵주기도 아이콘을 만듭니다</small></button>
    <button class="btn hidden" id="setUpdate">앱 업데이트 확인</button>
    <button class="btn" id="setAbout">앱 정보</button>
    <button class="btn" id="setHome">처음부터 다시 시작</button>
    <button class="btn danger" id="setWipe">달력 체크 기록 전체 지우기</button>
    <div style="font-size:.75rem;color:var(--dim);line-height:1.6;margin-top:12px;text-align:center">성화 출처: 위키미디어 공용(퍼블릭 도메인 작품). 조토, 프라 안젤리코, 두초, 카라바조.<br>성모 승천 사진: MiguelHermoso, CC BY-SA 4.0</div>
    <button class="btn link" id="closeSet">닫기</button>
  </div>
</div>

<script>
const VERSION = "1.0.0";
const NATIVE = window.AppNative || null;   // 안드로이드 앱 안에서만 있음
/* ───────── 기도문 ───────── */
const P = {
  sign: "성부와 성자와 성령의 이름으로. 아멘.",
  creed: "전능하신 천주 성부\n천지의 창조주를 저는 믿나이다.\n그 외아들 우리 주 예수 그리스도님\n성령으로 인하여 동정 마리아께 잉태되어 나시고\n본시오 빌라도 통치 아래서 고난을 받으시고\n십자가에 못 박혀 돌아가시고 묻히셨으며\n저승에 가시어 사흗날에 죽은 이들 가운데서 부활하시고\n하늘에 올라 전능하신 천주 성부 오른편에 앉으시며\n그리로부터 산 이와 죽은 이를 심판하러 오시리라 믿나이다.\n성령을 믿으며\n거룩하고 보편된 교회와\n모든 성인의 통공을 믿으며\n죄의 용서와\n육신의 부활을 믿으며\n영원한 삶을 믿나이다. 아멘.",
  of: "하늘에 계신 우리 아버지,\n아버지의 이름이 거룩히 빛나시며\n아버지의 나라가 오시며\n아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지소서.\n오늘 저희에게 일용할 양식을 주시고\n저희에게 잘못한 이를 저희가 용서하오니\n저희 죄를 용서하시고\n저희를 유혹에 빠지지 않게 하시고\n악에서 구하소서. 아멘.",
  hm: "은총이 가득하신 마리아님, 기뻐하소서!\n주님께서 함께 계시니 여인 중에 복되시며\n태중의 아드님 예수님 또한 복되시나이다.\n천주의 성모 마리아님,\n이제와 저희 죽을 때에\n저희 죄인을 위하여 빌어주소서. 아멘.",
  gb: "영광이 성부와 성자와 성령께\n처음과 같이 이제와 항상 영원히. 아멘.",
  fatima: "예수님, 저희 죄를 용서하시며\n저희를 지옥 불에서 구하시고\n연옥 영혼을 돌보시며\n가장 버림받은 영혼들을 돌보소서.",
  salve: "○ 모후이시며 사랑이 넘친 어머니,\n    우리의 생명, 기쁨, 희망이시여,\n● 당신 우러러 하와의 그 자손들이\n    눈물을 흘리며 부르짖나이다,\n    슬픔의 골짜기에서.\n○ 우리들의 보호자 성모님,\n    불쌍한 저희를\n    인자로운 눈으로 굽어보소서.\n● 귀양살이 끝날 때에\n    당신의 아들 우리 주 예수님 뵙게 하소서.\n    너그러우시고 자애로우시며\n    오! 아름다우신 동정 마리아님.\n○ 천주의 성모님, 저희를 위하여 빌어 주시어\n● 그리스도께서 약속하신 영원한 생명을 얻게 하소서.\n\n╋ 기도합시다.\n    하느님,\n    외아드님께서 삶과 죽음과 부활로\n    저희에게 영원한 구원을 마련해 주셨나이다.\n    복되신 동정 마리아와 함께 이 신비를 묵상하며\n    묵주 기도를 바치오니\n    저희가 그 가르침을 따라\n    영원한 생명을 얻게 하소서.\n    우리 주 그리스도를 통하여 비나이다.\n◎ 아멘."
};

const SETS = {
  joyful: {name:"환희의 신비", short:"환희", color:"#4f8fd0", m:[
    "마리아께서 예수님을 잉태하심",
    "마리아께서 엘리사벳을 찾아보심",
    "마리아께서 예수님을 낳으심",
    "마리아께서 예수님을 성전에 바치심",
    "마리아께서 잃으셨던 예수님을 성전에서 찾으심"]},
  luminous: {name:"빛의 신비", short:"빛", color:"#e0b03a", m:[

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dkey(new Date());
function keyToUTC(k){ const [y,m,d] = k.split("-").map(Number); return Date.UTC(y, m-1, d); }
const novPet = () => novena && novena.pet != null ? novena.pet : 27;
const novThx = () => novena && novena.thx != null ? novena.thx : 27;
const novTotal = () => novPet() + novThx();
const novTitle = () => `${novTotal()}일 기도`;
const DAY = 86400000;
const novSkips = () => (novena && Array.isArray(novena.skips)) ? novena.skips : [];
function isSkipped(k){ return !!novena && novSkips().includes(k) && k >= novena.start && k <= novEndKey(); }
function novEndUTC(){
  const st = keyToUTC(novena.start);
  let end = st + (novTotal()-1)*DAY, prev = -1;
  while(end !== prev){
    prev = end;
    const c = novSkips().filter(x => keyToUTC(x) >= st && keyToUTC(x) <= end).length;
    end = st + (novTotal()-1 + c)*DAY;
  }
  return end;
}
function novEndKey(){ const d = new Date(novEndUTC()); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
function novenaDay(k){
  if(!novena || k < novena.start || novSkips().includes(k)) return null;
  const before = novSkips().filter(x => x >= novena.start && x < k).length;
  const n = Math.round((keyToUTC(k) - keyToUTC(novena.start)) / DAY) + 1 - before;
  return (n >= 1 && n <= novTotal()) ? n : null;
}
function saveNovena(){ save("rosary.novena", novena); }
function novenaLabel(n){ return n <= novPet() ? `청원 ${n}일` : `감사 ${n-novPet()}일`; }
function novKind(n){ return n <= novPet() ? "청원" : "감사"; }
function mdText(utcMs){ const d = new Date(utcMs); return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일`; }

// seg 0: 시작 기도, seg 1·2·3…: 각 신비, seg 99: 마침 기도
function openingSteps(){
  const s = [];
  s.push({k:"sign", title:"성호경", bead:"cross", seg:0});
  s.push({k:"creed", title:"사도신경", bead:"cross", seg:0});
  s.push({k:"of", title:"주님의 기도", bead:"p1", seg:0});
  for(let i=1;i<=3;i++) s.push({k:"hm", title:"성모송", n:i, total:3, bead:"h"+i, seg:0});
  s.push({k:"gb", title:"영광송", bead:null, seg:0});
  s.push({k:"fatima", title:"구원의 기도", bead:null, seg:0});
  return s;
}
function decadeSteps(set, seg){
  const s = [];
  let loop = 0;
  for(let d=0; d<5; d++){
    const ofBead = d === 0 ? (seg === 1 ? "p5" : "medal") : "L"+(loop++);
    s.push({k:"of", d, set, seg, title:"주님의 기도", bead:ofBead, announce:true});
    for(let i=1;i<=10;i++) s.push({k:"hm", d, set, seg, title:"성모송", n:i, total:10, bead:"L"+(loop++)});
    s.push({k:"gb", d, set, seg, title:"영광송", bead:null});
    s.push({k:"fatima", d, set, seg, title:"구원의 기도", bead:null});
  }
  return s;
}
function closingSteps(){
  return [
    {k:"salve", title:"성모 찬송", bead:"medal", seg:99},
    {k:"sign", title:"성호경", bead:"cross", seg:99, last:true}
  ];
}

let sess = load("rosary.session", null);   // {day, sets:[], closed, idx, rec, finished}
let steps = [];
function buildSteps(){
  steps = openingSteps();
  sess.sets.forEach((k, i) => steps.push(...decadeSteps(k, i+1)));
  if(sess.closed) steps.push(...closingSteps());
}
function persist(){ save("rosary.session", sess); }
function curSet(){
  if(!sess || !sess.sets.length) return SETS.joyful;
  const s = steps[Math.min(sess.idx, steps.length-1)];
  if(s && s.set) return SETS[s.set];
  return SETS[s && s.seg === 99 ? sess.sets[sess.sets.length-1] : sess.sets[0]];
}

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
const svg = document.getElementById("rosary");
const beadEls = {};
let cimg, clabel;
(function drawRosary(){
  // 모서리가 둥근 세로 직사각형 고리
  const XL=12, XR=328, YT=8, YB=236, R=40, CX=170;
  const defs = el("defs", {}, svg);
  const f = el("filter", {id:"glow", x:"-100%", y:"-100%", width:"300%", height:"300%"}, defs);
  el("feGaussianBlur", {stdDeviation:"3", result:"b"}, f);
  const mg = el("feMerge", {}, f); el("feMergeNode", {in:"b"}, mg); el("feMergeNode", {in:"SourceGraphic"}, mg);
  const IX=XL+22, IY=YT+22, IW=XR-XL-44, IH=YB-YT-44;
  const cp = el("clipPath", {id:"cc"}, defs); el("rect", {x:IX, y:IY, width:IW, height:IH, rx:10}, cp);

  // 둘레 경로: 아래 가운데에서 시작해 오른쪽 → 위 → 왼쪽 → 다시 아래 가운데
  const segs = [];
  const line = (x1,y1,x2,y2) => segs.push({len:Math.hypot(x2-x1,y2-y1), at:t=>[x1+(x2-x1)*t, y1+(y2-y1)*t]});
  const arc = (cx,cy,a1,a2) => segs.push({len:Math.abs(a2-a1)*Math.PI/180*R, at:t=>{const a=(a1+(a2-a1)*t)*Math.PI/180; return [cx+R*Math.cos(a), cy+R*Math.sin(a)];}});
  line(CX,YB, XR-R,YB);          arc(XR-R,YB-R, 90,0);
  line(XR,YB-R, XR,YT+R);        arc(XR-R,YT+R, 0,-90);
  line(XR-R,YT, XL+R,YT);        arc(XL+R,YT+R, -90,-180);
  line(XL,YT+R, XL,YB-R);        arc(XL+R,YB-R, 180,90);
  line(XL+R,YB, CX,YB);
  const L = segs.reduce((a,g)=>a+g.len, 0);
  function pointAt(d){ for(const g of segs){ if(d <= g.len) return g.at(g.len ? d/g.len : 0); d -= g.len; } return [CX,YB]; }

  el("rect", {x:XL, y:YT, width:XR-XL, height:YB-YT, rx:R, class:"cord"}, svg);
  el("line", {x1:CX, y1:YB, x2:CX, y2:320, class:"cord"}, svg);
  el("rect", {x:IX-1, y:IY-1, width:IW+2, height:IH+2, rx:11, class:"ring"}, svg);
  cimg = el("image", {x:IX, y:IY, width:IW, height:IH, "clip-path":"url(#cc)", preserveAspectRatio:"xMidYMid meet", visibility:"hidden"}, svg);
  clabel = el("text", {x:CX, y:IY+IH/2+10, id:"centerLabel"}, svg);

  const BIG = new Set([10,21,32,43]);
  for(let k=1;k<=54;k++){
    const [x,y] = pointAt(k*L/55);
    const i = k-1;
    beadEls["L"+i] = el("circle", {cx:x, cy:y, r:BIG.has(i)?9:6.5, class:"bead"}, svg);
  }
  beadEls.medal = el("rect", {x:CX-8, y:YB-9, width:16, height:18, rx:4, class:"bead"}, svg);
  beadEls.p5 = el("circle", {cx:CX, cy:253, r:9, class:"bead"}, svg);
  beadEls.h3 = el("circle", {cx:CX, cy:269, r:6.5, class:"bead"}, svg);
  beadEls.h2 = el("circle", {cx:CX, cy:283, r:6.5, class:"bead"}, svg);
  beadEls.h1 = el("circle", {cx:CX, cy:297, r:6.5, class:"bead"}, svg);
  beadEls.p1 = el("circle", {cx:CX, cy:313, r:9, class:"bead"}, svg);
  const g = el("g", {class:"crossg"}, svg);
  el("rect", {x:CX-4.5, y:323, width:9, height:26, rx:1.5}, g);
  el("rect", {x:CX-13, y:329, width:26, height:7, rx:1.5}, g);
  beadEls.cross = g;
  for(const k in beadEls){ const e = beadEls[k]; if(e.tagName === "circle") e.dataset.r = e.getAttribute("r"); }
})();

function updateBeads(){
  const idx = sess.idx;
  const finished = idx >= steps.length;
  const cur = steps[Math.min(idx, steps.length-1)];
  const lastSetSeg = sess.sets.length;
  const done = new Set();
  let now = null;
  for(let j=0; j<=Math.min(idx, steps.length-1); j++){
    const s = steps[j];
    if(!s.bead) continue;
    // 두 번째 신비부터는 고리 구슬을 새로 셉니다
    const visible = s.seg === 0 || s.seg === cur.seg || (cur.seg === 99 && s.seg === lastSetSeg);
    if(!visible) continue;
    if(j < idx || finished) done.add(s.bead);
    now = s.bead;
  }
  if(finished) now = null;
  for(const key in beadEls){
    const base = key === "cross" ? "crossg" : "bead";
    let c = base;
    if(key === now) c += " now"; else if(done.has(key)) c += " done";
    const e = beadEls[key];
    e.setAttribute("class", c);
    if(e.dataset && e.dataset.r) e.setAttribute("r", key === now ? (+e.dataset.r * 1.4) : e.dataset.r);
  }
}

/* ───────── 성화 ───────── */
const imgRes = {};      // "joyful0" → 찾은 주소 또는 null
const imgWait = {};
function resolveImg(set, d, cb){
  const key = set + d;
  if(key in imgRes) return cb(imgRes[key]);
  if(imgWait[key]){ imgWait[key].push(cb); return; }
  imgWait[key] = [cb];
  const list = [imgPath(set, d), ...((COMMONS[set] && COMMONS[set][d]) || []).map(fp)];
  let i = 0;
  const done = src => { imgRes[key] = src; const w = imgWait[key]; delete imgWait[key]; w.forEach(f => f(src)); };
  const tryNext = () => {
    if(i >= list.length) return done(null);
    const src = list[i++];
    const im = new Image();
    im.onload = () => done(src);
    im.onerror = tryNext;
    im.src = src;
  };
  tryNext();
}
function preloadSet(set){ if(settings.img) for(let d=0; d<5; d++) resolveImg(set, d, () => {}); }
let wantCenter = null;
function updateCenter(){
  const idx = sess.idx;
  const cur = steps[Math.min(idx, steps.length-1)];
  let label;
  if(idx >= steps.length) label = "아멘";
  else if(cur.d != null) label = (cur.d+1) + "단";
  else label = cur.seg === 0 ? "시작 기도" : "마침 기도";
  clabel.textContent = label;
  clabel.setAttribute("visibility", "visible");
  cimg.setAttribute("visibility", "hidden");
  wantCenter = null;
  if(settings.img && idx < steps.length && cur.d != null){
    const want = cur.set + cur.d;
    wantCenter = want;
    resolveImg(cur.set, cur.d, src => {
      if(src && wantCenter === want){
        cimg.setAttribute("href", src);
        cimg.setAttribute("visibility", "visible");
        clabel.setAttribute("visibility", "hidden");
      }
    });
  }
}

/* ───────── 화면 그리기 ───────── */
const $ = id => document.getElementById(id);
function textOf(s){ return s.k === "sign" ? P.sign : P[s.k]; }
function stepLabel(s){
  if(s.k === "of" && s.d != null){
    return (s.d === 0 && s.seg > 1) ? `${SETS[s.set].short} 1단 주님의 기도` : `${s.d+1}단 주님의 기도`;
  }
  if(s.last) return "마침 성호경";
  return s.title;
}
function upcoming(from, max){
  const groups = [];
  let reachedEnd = true;
  for(let j=from+1;j<steps.length;j++){
    const s = steps[j], lab = stepLabel(s), last = groups[groups.length-1];
    if(last && s.k === "hm" && last.lab === lab){ last.c++; continue; }
    if(groups.length >= max){ reachedEnd = false; break; }
    groups.push({lab, c:1});
  }
  const out = groups.map(g => g.c > 1 ? `${g.lab} ${g.c}번` : g.lab);
  if(reachedEnd && !sess.closed) out.push("신비 선택");
  return out;
}

function applyLook(){
  const h = document.documentElement;
  h.classList.toggle("fs-large", settings.fs === "large");
  h.classList.toggle("fs-xlarge", settings.fs === "xlarge");
  document.body.classList.toggle("dark", settings.dark);
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute("content", settings.dark ? "#15110e" : "#fbf8f2");
  document.body.classList.toggle("hidetext", settings.hide);
  if(NATIVE && NATIVE.setTheme){ try{ NATIVE.setTheme(!!settings.dark); }catch(e){} }
}

function render(){
  applyLook();
  if(!sess) return;
  const idx = sess.idx;
  const set = curSet();
  updateBeads();
  updateCenter();

  if(idx >= steps.length){
    $("hdTitle").textContent = "묵주기도";
    $("prayer").innerHTML = "";
    $("next").innerHTML = "";
    $("doneSet").textContent = sess.sets.map(k => SETS[k].name).join(" · ");
    const d = new Date();
    $("doneDate").textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
    $("done").classList.remove("hidden");
    return;
  }
  $("done").classList.add("hidden");
  const cur = steps[idx];

  $("hdTitle").textContent = cur.d != null ? `${set.name} · ${cur.d+1}단`
    : `${set.name} · ${cur.seg === 0 ? "시작 기도" : "마침 기도"}`;

  let h = `<div class="step-name">${stepLabel(cur)}</div>`;
  if(cur.k === "hm"){ const left = cur.total - cur.n; h += `<div class="counter">${cur.n} / ${cur.total} · ${left === 0 ? "마지막" : left + "번 남음"}</div>`; }
  if(cur.announce) h += `<div class="announce"><span class="set">${set.name} ${cur.d+1}단</span><br>${set.m[cur.d]}을 묵상합시다.</div>`;
  h += `<div class="text${cur.k === "salve" ? " resp" : ""}">${textOf(cur)}</div>`;
  $("prayer").innerHTML = h;
  $("prayer").scrollTop = 0;

  let n = "";

  const lastPhase = (cur.d === 4 && (cur.k === "gb" || cur.k === "fatima")) || cur.seg === 99;
  const up = upcoming(idx, lastPhase ? 8 : 3);
  n += up.length ? `<div>다음: ${up.join(" → ")}</div>` : `<div>마지막 기도입니다</div>`;
  if(cur.seg === 0 && (cur.k === "gb" || cur.k === "fatima")){
    const s1 = SETS[sess.sets[0]];
    n += `<div class="nd">다음 단 · ${s1.name} 1단 — ${s1.m[0]}</div>`;
  }
  if(cur.d != null && cur.d < 4 && ((cur.k === "hm" && cur.n >= 9) || cur.k === "gb" || cur.k === "fatima")){
    n += `<div class="nd">다음 ${cur.d+2}단 · ${set.m[cur.d+1]}</div>`;
  }
  if(cur.d === 4 && (cur.k === "hm" && cur.n >= 9 || cur.k === "gb" || cur.k === "fatima")){
    n += `<div class="nd">이번 단이 마지막 단입니다. 마치면 다른 신비를 고르거나 끝낼 수 있습니다</div>`;
  }
  $("next").innerHTML = n;
}

  img.classList.add("hidden");
  img.onload = null;
  img.removeAttribute("src");      // 이전 성화가 남아 보이지 않게 비운다
  if(settings.img){
    resolveImg(step.set, step.d, src => {
      if(!src || token !== ovToken) return;
      // 새 그림이 다 불러와진 뒤에만 보여 준다
      img.onload = () => { if(token === ovToken) img.classList.remove("hidden"); };
      img.src = src;
      if(img.complete && img.naturalWidth) img.classList.remove("hidden");
    });
  }
  const ov = $("overlay");
  ov.classList.remove("hidden", "fade");
  clearTimeout(ovTimer);   // 자동으로 닫지 않고, 화면을 눌러야 넘어간다
}
function hideOverlay(){
  const ov = $("overlay");
  if(ov.classList.contains("hidden")) return;
  ovToken++;
  ov.classList.add("fade");
  clearTimeout(ovTimer);
  ovTimer = setTimeout(() => ov.classList.add("hidden"), 450);
}

/* ───────── 신비 선택 창 ───────── */
function setBtn(k, extra){
  const s = SETS[k];
  return `<button class="btn" data-set="${k}"><span class="dot" style="background:${s.color}"></span>${s.name}${extra ? `<small>${extra}</small>` : ""}</button>`;
}
function showChooser(mode){
  const today = new Date();
  const tk = todayKey();
  const prayed = hist[tk] || [];
  let h = "";
  if(mode === "start"){
    const auto = DAY_SET[today.getDay()];
    h += `<div class="ch-title">오늘 바칠 신비</div>`;
    h += `<div class="ch-sub">${today.getMonth()+1}월 ${today.getDate()}일 ${WD[today.getDay()]}요일</div>`;
    if(sess && sess.day === tk && !sess.finished && sess.idx > 0 && sess.idx < steps.length){
      const c = steps[sess.idx];
      const where = c.d != null ? `${SETS[c.set].name} ${c.d+1}단` : (c.seg === 0 ? "시작 기도" : "마침 기도");
      h += `<button class="btn main" data-act="resume">이어서 하기<small>${where} · ${stepLabel(c)}</small></button>`;
    }
    const nd = novenaDay(tk);
    if(nd){
      const nk = NOV_SET[(nd-1) % 3];
      h += `<button class="btn main" data-set="${nk}">${novTitle()} ${nd}일째 · ${novKind(nd)}<small>${SETS[nk].name}</small></button>`;
    }
    h += `<button class="btn main" data-set="${auto}">자동<small>오늘은 ${SETS[auto].name}</small></button>`;
    h += `<div class="grid2">${SET_ORDER.map(k => setBtn(k, prayed.includes(k) ? "오늘 바침" : "")).join("")}</div>`;
    h += `<button class="btn link" data-act="cal">묵주기도 달력</button>`;
    if(canInstallUI()) h += `<button class="btn" data-act="install">앱처럼 설치하기<small>홈 화면에 묵주기도 아이콘을 만듭니다</small></button>`;
  } else {
    const name = SETS[sess.sets[sess.sets.length-1]].name;
    h += `<div class="ch-title">${name}를 마쳤습니다</div>`;
    h += `<div class="ch-sub">여기서 마치거나 다른 신비를 이어서 바칠 수 있습니다</div>`;
    h += `<button class="btn main" data-act="end">성모 찬송으로 마치기<small>성모 찬송과 마침 기도 → 성호경</small></button>`;
    h += `<button class="btn" data-act="more">다른 신비 이어서 하기</button>`;
    h += `<div class="grid2 more-sets hidden" id="moreSets">${SET_ORDER.map(k => setBtn(k, prayed.includes(k) ? "오늘 바침" : "")).join("")}</div>`;
    h += `<button class="btn link" data-act="back">◀ 5단으로 돌아가기</button>`;
  }
  $("chooserBody").innerHTML = h;
  $("chooser").dataset.mode = mode;
  $("chooser").classList.remove("hidden");
}
function hideChooser(){ $("chooser").classList.add("hidden"); }

$("chooserBody").addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  const mode = $("chooser").dataset.mode;
  if(b.dataset.act === "cal"){ showCal(); return; }
  if(b.dataset.act === "install"){ doInstall(); return; }
  if(b.dataset.act === "more"){ $("moreSets").classList.toggle("hidden"); return; }
  if(b.dataset.act === "resume"){ hideChooser(); render(); wake(); return; }
  if(b.dataset.act === "back"){ hideChooser(); return; }
  if(b.dataset.act === "end"){
    sess.closed = true; buildSteps(); sess.idx++;
    persist(); hideChooser(); render(); return;
  }
  const k = b.dataset.set;
  if(!k) return;
  if(mode === "start"){
    sess = {day: todayKey(), sets:[k], closed:false, idx:0, rec:0, finished:false};
    buildSteps(); persist(); hideChooser(); $("done").classList.add("hidden"); render(); wake(); preloadSet(k);
  } else {
    sess.sets.push(k); buildSteps(); sess.idx++; preloadSet(k);
    persist(); hideChooser(); render();
    showOverlay(steps[sess.idx]);
  }
});

/* ───────── 기록 ───────── */
function recordSets(){
  const tk = todayKey();
  while(sess.rec < sess.sets.length){
    (hist[tk] = hist[tk] || []).push(sess.sets[sess.rec]);
    sess.rec++;
  }
  save("rosary.hist", hist);
}

/* ───────── 진행 ───────── */
function vib(p){ if(settings.vib && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
let lastTap = 0;
function next(){
  const t = Date.now();
  if(t - lastTap < 280) return;
  lastTap = t;
  wake();
  if(!sess || sess.idx >= steps.length) return;
  const prev = steps[sess.idx];
  if(sess.idx === steps.length - 1){
    if(sess.closed){
      sess.idx++; sess.finished = true; vib(300);
      persist(); render();
    } else {
      recordSets(); persist(); vib([70,90,70]);
      showChooser("continue");
    }
    return;
  }
  sess.idx++;
  if(prev.k === "hm" && prev.total === 10 && prev.n === 10) vib([70,90,70]);  // 한 단 끝: 두 번
  else vib(18);                                                              // 구슬 하나: 톡
  if(steps[sess.idx].announce) showOverlay(steps[sess.idx]);
  persist(); render();
}
function prev(){
  if(!sess) return;
  if(sess.idx > 0) sess.idx--;
  sess.finished = false;
  hideOverlay();
  persist(); render();
}

/* ───────── 확인 창 ───────── */
let dlgOk = null;
function openDlg(html){ $("dlgBody").innerHTML = html; $("dlg").classList.remove("hidden"); }
function closeDlg(){ $("dlg").classList.add("hidden"); dlgOk = null; }
function notify(msg){
  openDlg(`<div class="dlg-msg">${msg}</div><button class="btn" data-dlg="close">확인</button>`);
}
function askConfirm(msg, okLabel, onOk){
  dlgOk = onOk;
  openDlg(`<div class="dlg-msg">${msg}</div><div class="dlg-row2"><button class="btn" data-dlg="close">취소</button><button class="btn danger" data-dlg="ok">${okLabel}</button></div>`);
}
$("dlg").addEventListener("click", e => {
  if(e.target.id === "dlg"){ closeDlg(); return; }
  const b = e.target.closest("[data-dlg]");

});

/* ───────── 날짜별 체크 ───────── */
function showDay(k){
  const [y,m,d] = k.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const future = k > todayKey();
  const rec = hist[k] || [];
  const nd = novenaDay(k), sk = isSkipped(k);
  let h = `<div class="sheet-title" style="text-align:center">${m}월 ${d}일 ${WD[dt.getDay()]}요일</div>`;
  if(novena && nd){
    h += `<div class="ch-sub" style="margin-bottom:6px">${novTitle()} · ${novenaLabel(nd)}째 · ${SETS[NOV_SET[(nd-1)%3]].name}</div>`;
  } else if(sk){
    h += `<div class="ch-sub" style="margin-bottom:6px;color:#c0614f">${novTitle()}를 빼먹은 날</div>`;
  } else {
    h += `<div class="ch-sub" style="margin-bottom:6px">이날의 신비 · ${SETS[DAY_SET[dt.getDay()]].name}</div>`;
  }
  if(future){
    h += `<div class="dlg-msg">아직 오지 않은 날입니다</div>`;
  } else {
    h += SET_ORDER.map(s => `<label class="row"><span><span class="dot" style="background:${SETS[s].color}"></span>${SETS[s].name}</span><input type="checkbox" data-k="${k}" data-chk="${s}" ${rec.includes(s) ? "checked" : ""}></label>`).join("");
    if(novena && (nd || sk)){
      h += sk
        ? `<button class="btn" data-dlg="skip" data-k="${k}">빼먹음 표시 풀기</button>`
        : `<button class="btn danger" data-dlg="skip" data-k="${k}">이날 빼먹음으로 표시<small>이날 차례가 다음 날로 넘어가고 끝나는 날이 하루 늦춰집니다</small></button>`;
    }
  }
  h += `<button class="btn link" data-dlg="close">닫기</button>`;
  openDlg(h);
}
function toggleCheck(k, s, on){
  let rec = (hist[k] || []).filter(x => x !== s);
  if(on) rec.push(s);
  if(rec.length) hist[k] = rec; else delete hist[k];
  save("rosary.hist", hist);
  drawCal();
}
function toggleSkip(k){
  if(!novena) return;
  const list = novSkips().slice();
  const i = list.indexOf(k);
  if(i >= 0) list.splice(i, 1); else list.push(k);
  novena.skips = list.sort();
  saveNovena(); drawCal(); showDay(k);
}

/* ───────── 묵주기도 달력 ───────── */
let calY, calM;
function showCal(){
  const d = new Date(); calY = d.getFullYear(); calM = d.getMonth();
  drawCal();
  $("cal").classList.remove("hidden");
}
function drawCal(){
  $("calMonth").textContent = `${calY}년 ${calM+1}월`;
  const tk = todayKey();
  let h = WD.map((w,i) => `<div class="cal-wd${i===0?" sun":""}">${w}</div>`).join("");
  const first = new Date(calY, calM, 1).getDay();
  const days = new Date(calY, calM+1, 0).getDate();
  let prayedDays = 0;
  for(let i=0;i<first;i++) h += `<div class="cell empty"></div>`;
  for(let day=1; day<=days; day++){
    const dt = new Date(calY, calM, day);
    const k = dkey(dt);
    const nd = novenaDay(k);
    const sk = isSkipped(k);
    const tagSet = nd ? NOV_SET[(nd-1) % 3] : DAY_SET[dt.getDay()];
    const rec = hist[k] || [];
    if(rec.length) prayedDays++;
    let c = "cell";
    if(k === tk) c += " today";
    if(nd) c += " nov";
    if(sk) c += " skip";
    if(nd && k < tk && !rec.length) c += " miss";
    h += `<div class="${c}" data-k="${k}"><div class="num">${day}</div><div class="tag">${sk ? "" : SETS[tagSet].short}</div>`;
    if(rec.length) h += `<div class="dots">${rec.map(s => `<i style="background:${SETS[s].color}"></i>`).join("")}</div>`;
    if(nd) h += `<div class="nv">${novenaLabel(nd)}</div>`;
    if(sk) h += `<div class="sk">빼먹음</div>`;
    h += `</div>`;
  }
  $("calGrid").innerHTML = h;
  $("calLegend").innerHTML = SET_ORDER.map(k => `<span><span class="dot" style="background:${SETS[k].color}"></span>${SETS[k].name}</span>`).join("");
  $("calStat").textContent = `칸 안의 글자는 그날 바칠 신비, 점은 실제로 바친 신비입니다 · 이번 달 ${prayedDays}일 바침 · 날짜를 누르면 체크할 수 있습니다`;

  let nb = "";
  const ndToday = novenaDay(tk);
  if(novena){
    const st = keyToUTC(novena.start);
    nb += `<div>${novTitle()} (청원 ${novPet()}일 + 감사 ${novThx()}일)</div>`;
    nb += `<div>${mdText(st)} 시작, ${mdText(novEndUTC())} 끝</div>`;
    const skc = novSkips().filter(x => x >= novena.start && x <= novEndKey()).length;
    if(skc) nb += `<div style="color:#c0614f">빼먹은 날 ${skc}일 · 끝나는 날이 ${skc}일 늦춰졌습니다</div>`;
    if(ndToday){
      const nk = NOV_SET[(ndToday-1) % 3];
      nb += `<div style="color:var(--gold)">오늘 ${ndToday}일째 (${novenaLabel(ndToday)}) · ${SETS[nk].name}</div>`;
    } else if(keyToUTC(tk) < keyToUTC(novena.start)){
      nb += `<div>아직 시작 전입니다</div>`;
    } else {
      nb += `<div>${novTitle()}를 마쳤습니다</div>`;
    }
  } else {
    nb += `<div>묵주기도 일수 정하기</div>`;
    nb += `<div class="nov-form">시작일 <input type="date" id="novDate" value="${tk}"></div>`;
    nb += `<div class="nov-form">청원 <input type="number" id="novPet" value="27" min="0" max="999" inputmode="numeric">일 · 감사 <input type="number" id="novThx" value="27" min="0" max="999" inputmode="numeric">일</div>`;
    nb += `<div id="novPreview" style="color:var(--gold)"></div>`;
    nb += `<button class="btn" id="novStart"></button>`;
  }
  nb += `<button class="btn link" id="novStop">${novena ? novTitle() : "54일 기도"} 기록 지우기</button>`;
  $("novBox").innerHTML = nb;
  if(!novena) updateNovPreview();
}
function readNovForm(){
  const v = $("novDate").value;
  const pet = Math.max(0, Math.min(999, parseInt($("novPet").value, 10) || 0));
  const thx = Math.max(0, Math.min(999, parseInt($("novThx").value, 10) || 0));
  return {start: v, pet, thx, total: pet + thx};
}
function updateNovPreview(){
  const f = readNovForm();
  const ok = f.start && f.total > 0;
  $("novPreview").textContent = ok
    ? `청원 ${f.pet}일 + 감사 ${f.thx}일 = ${f.total}일 기도, ${mdText(keyToUTC(f.start) + (f.total-1)*86400000)} 끝`
    : "일수를 1일 이상으로 정해 주세요";
  $("novStart").textContent = ok ? `이 날짜부터 ${f.total}일 기도 시작` : "시작";
  $("novStart").disabled = !ok;
}
$("novBox").addEventListener("click", e => {
  if(e.target.id === "novStart"){
    const f = readNovForm();
    if(!f.start || f.total <= 0) return;
    novena = {start: f.start, pet: f.pet, thx: f.thx, skips: []}; saveNovena(); drawCal();
  } else if(e.target.id === "novStop"){
    if(!novena){ notify("지울 기록이 없습니다"); return; }
    askConfirm(`${novTitle()} 기록을 정말 지울까요?\n시작일, 일수, 빼먹은 날 표시가 모두 지워집니다.\n신비 체크 기록은 남습니다.`, "지우기", () => {
      novena = null; save("rosary.novena", null); drawCal();
    });
  }
});
$("novBox").addEventListener("input", e => { if(["novDate","novPet","novThx"].includes(e.target.id)) updateNovPreview(); });
$("calGrid").addEventListener("click", e => {
  const c = e.target.closest(".cell[data-k]");
  if(c) showDay(c.dataset.k);
});
$("calPrev").addEventListener("click", () => { calM--; if(calM < 0){ calM = 11; calY--; } drawCal(); });
$("calNext").addEventListener("click", () => { calM++; if(calM > 11){ calM = 0; calY++; } drawCal(); });
$("calClose").addEventListener("click", () => {
  $("cal").classList.add("hidden");
  if(!$("chooser").classList.contains("hidden")) showChooser($("chooser").dataset.mode);
});

/* ───────── 화면 켜 두기 ───────── */
let wl = null;
async function wake(){
  if(NATIVE && NATIVE.keepAwake){ try{ NATIVE.keepAwake(!!settings.wake); }catch(e){} return; }
  if(!settings.wake || !("wakeLock" in navigator) || wl) return;
  try{ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") wake(); });

  $(id).addEventListener("change", e => {

  });
}
bindSetting("sHide", "hide");

bindSetting("sDark", "dark");
$("sFs").addEventListener("change", e => { settings.fs = e.target.value; save("rosary.settings", settings); render(); });
bindSetting("sVib", "vib");
bindSetting("sWake", "wake");
document.addEventListener("keydown", e => {
  const blocked = ["settings","chooser","cal","dlg"].some(id => !$(id).classList.contains("hidden"));
  if(blocked) return;
  if(e.key === " " || e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); next(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); prev(); }

/* ───────── 앱 설치 · 기록 보관 · 성화 저장 · 업데이트 ───────── */
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
window.addEventListener("appinstalled", () => { installEvt = null; });
const canInstallUI = () => !NATIVE && !isStandalone();
function doInstall(){
  if(installEvt){ const e = installEvt; installEvt = null; e.prompt(); return; }
  const ua = navigator.userAgent;
  let how;
  if(/iPhone|iPad|iPod/.test(ua)){
    how = "화면 아래 가운데의 공유 버튼(네모에서 화살표가 위로 나온 모양)을 누르고\n'홈 화면에 추가'를 누르세요.\n사파리에서만 됩니다.";
  } else if(/KAKAOTALK|NAVER|Line\/|FBAN|FBAV|Instagram/i.test(ua)){
    how = "지금 열린 화면(카카오톡·네이버 등)에서는 설치할 수 없습니다.\n오른쪽 위 ⋮ 메뉴에서 '다른 브라우저로 열기'나 '크롬으로 열기'를 누른 뒤, 다시 설치 버튼을 눌러 주세요.";
  } else {
    how = "오른쪽 위 ⋮ 메뉴(삼성 인터넷은 아래 ≡ 메뉴)에서\n'홈 화면에 추가' 또는 '앱 설치'를 누르세요.\n이미 설치했다면 홈 화면의 묵주기도 아이콘으로 여세요.";
  }
  notify(how);
}

/* 기록 보관: 달력 기록을 글자 덩어리로 바꿔 복사·공유하고, 붙여 넣어 가져옵니다 */
function enc(o){
  const b = new TextEncoder().encode(JSON.stringify(o));
  let s = ""; b.forEach(c => { s += String.fromCharCode(c); });
  return "ROSARY1:" + btoa(s);
}
function dec(t){
  t = (t || "").trim();
  const i = t.indexOf("ROSARY1:");
  if(i < 0) throw new Error("no prefix");
  const s = atob(t.slice(i + 8).replace(/\s+/g, ""));
  const b = Uint8Array.from(s, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(b));
}
function backupCode(){ return enc({v:1, at:todayKey(), hist, novena}); }
function showBackup(){
  const days = Object.keys(hist).length;
  openDlg(
    `<div class="sheet-title" style="text-align:center">기록 옮기기·보관하기</div>` +
    `<div class="ch-sub" style="margin-bottom:6px">지금까지 ${days}일치 기록이 있습니다. 아래 글자를 복사해서 카카오톡 '나와의 채팅' 같은 곳에 보관해 두세요.</div>` +
    `<textarea class="code" id="bkOut" readonly></textarea>` +
    `<div class="dlg-row2"><button class="btn" id="bkCopy">복사하기</button><button class="btn" id="bkShare">보내기</button></div>` +
    `<div class="ch-sub" style="margin:16px 0 0">다른 기기나 보관해 둔 기록을 가져오려면 여기에 붙여 넣으세요.</div>` +
    `<textarea class="code" id="bkIn" placeholder="ROSARY1: 로 시작하는 글자"></textarea>` +
    `<button class="btn main" id="bkLoad">붙여 넣은 기록 가져오기</button>` +
    `<button class="btn link" data-dlg="close">닫기</button>`);
  $("bkOut").value = backupCode();
  if(!(NATIVE && NATIVE.shareText) && !navigator.share) $("bkShare").classList.add("hidden");
}
async function copyText(t, ta){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ try{ ta.focus(); ta.select(); return document.execCommand("copy"); }catch(_){ return false; } }
}
function importBackup(txt){
  let o;
  try{
    o = dec(txt);
    if(!o || typeof o.hist !== "object" || o.hist === null) throw new Error("bad");
  }catch(e){
    notify("가져올 수 없는 글자입니다.\n'ROSARY1:' 로 시작하는 기록 전체를 붙여 넣었는지 확인해 주세요.");
    return;
  }
  const keys = Object.keys(o.hist).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(o.hist[k]));
  askConfirm(`${keys.length}일치 기록을 이 기기의 기록에 합칠까요?` + (o.novena && o.novena.start ? "\n일수 기도 정보도 함께 가져옵니다." : ""), "합치기", () => {
    for(const k of keys){
      const set = new Set([...(hist[k] || []), ...o.hist[k].filter(x => SETS[x])]);
      const arr = SET_ORDER.filter(s => set.has(s));
      if(arr.length) hist[k] = arr;
    }
    save("rosary.hist", hist);
    if(o.novena && /^\d{4}-\d{2}-\d{2}$/.test(o.novena.start || "")){
      novena = {start:o.novena.start, pet:o.novena.pet, thx:o.novena.thx, skips:Array.isArray(o.novena.skips) ? o.novena.skips : []};
      saveNovena();
    }
    notify("기록을 가져왔습니다.\n달력에서 확인해 보세요.");
  });
}
$("dlg").addEventListener("click", e => {
  const id = e.target.id;
  if(id === "bkCopy"){
    copyText($("bkOut").value, $("bkOut")).then(ok => { e.target.textContent = ok ? "복사했습니다" : "글자를 길게 눌러 복사하세요"; });
  } else if(id === "bkShare"){
    const code = $("bkOut").value;
    if(NATIVE && NATIVE.shareText) NATIVE.shareText(code);
    else if(navigator.share) navigator.share({text: code}).catch(() => {});
  } else if(id === "bkLoad"){
    importBackup($("bkIn").value);
  } else if(id === "updGo"){
    const url = window.__updUrl;
    closeDlg();
    openDlg(`<div class="dlg-msg" id="updMsg">내려받는 중...</div>`);
    NATIVE.installUpdate(url);
  } else if(id === "updLater"){
    save("rosary.skipBuild", window.__updLatest || 0);
    closeDlg();
  }
});

/* 성화 미리 저장: 20장을 한 번씩 불러 두면 서비스 워커가 기기에 보관합니다 */
let preloading = false;
async function preloadAll(){
  if(preloading) return;
  if(!navigator.onLine){ notify("인터넷에 연결한 뒤 눌러 주세요."); return; }
  preloading = true;
  const total = SET_ORDER.length * 5;
  let n = 0, ok = 0; const fail = [];
  openDlg(`<div class="dlg-msg" id="pvMsg">성화를 저장하는 중입니다...\n0 / ${total}</div>`);
  for(const k of SET_ORDER){
    for(let d = 0; d < 5; d++){
      delete imgRes[k + d];
      await new Promise(res => resolveImg(k, d, src => {
        n++;
        if(src) ok++; else fail.push(`${SETS[k].short} ${d+1}단`);
        const m = $("pvMsg"); if(m) m.textContent = `성화를 저장하는 중입니다...\n${n} / ${total}`;
        res();
      }));
    }
  }
  preloading = false;
  notify(fail.length
    ? `${ok}장을 저장했습니다.\n불러오지 못한 그림: ${fail.join(", ")}\n나중에 다시 눌러 보세요.`
    : `성화 ${ok}장을 모두 저장했습니다.\n이제 인터넷 없이도 보입니다.`);
}

/* 안드로이드 앱 업데이트 알림 */
const REL_API = "https://api.github.com/repos/koreantch-stack/Rosary-pray/releases/tags/apk-latest";
async function checkUpdate(manual){
  if(!NATIVE || !NATIVE.versionCode || !NATIVE.installUpdate){ if(manual) notify("앱 안에서만 쓸 수 있습니다."); return; }
  try{
    const cur = Number(NATIVE.versionCode());
    const r = await fetch(REL_API, {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) throw new Error("release " + r.status);
    const j = await r.json();
    const m = /빌드 번호\s*(\d+)/.exec(j.body || "");
    const latest = m ? Number(m[1]) : 0;
    const asset = (j.assets || []).find(x => /\.apk$/i.test(x.name));
    if(!latest || !asset) throw new Error("release info");
    if(latest <= cur){ if(manual) notify("이미 최신 앱입니다."); return; }
    if(!manual && load("rosary.skipBuild", 0) === latest) return;
    window.__updUrl = asset.browser_download_url; window.__updLatest = latest;
    openDlg(`<div class="sheet-title" style="text-align:center">새 앱이 있습니다</div><div class="dlg-msg">새 버전을 내려받아 설치합니다.\n달력 기록은 그대로 남습니다.</div><button class="btn main" id="updGo">설치</button><button class="btn link" id="updLater">나중에</button>`);
  }catch(e){ if(manual) notify("업데이트를 확인하지 못했습니다.\n잠시 뒤 다시 눌러 주세요."); }
}
window.onUpdateProgress = p => {
  const m = $("updMsg"); if(m) m.textContent = p >= 0 ? `내려받는 중 ${p}%` : "내려받는 중...";
  if(p >= 100) setTimeout(closeDlg, 2500);
};
window.onUpdateFail = needPermission => {
  closeDlg();
  if(!needPermission) notify("내려받거나 설치하지 못했습니다.\n잠시 뒤 다시 눌러 주세요.");
};
// 안드로이드 뒤로 가기: 열린 창부터 닫고, 더 닫을 게 없으면 앱을 끝냅니다
window.onNativeBack = () => {
  if(!$("dlg").classList.contains("hidden")){ closeDlg(); return true; }
  if(!$("settings").classList.contains("hidden")){ $("settings").classList.add("hidden"); return true; }
  if(!$("cal").classList.contains("hidden")){ $("calClose").click(); return true; }
  if(!$("overlay").classList.contains("hidden")){ hideOverlay(); return true; }
  if(!$("chooser").classList.contains("hidden") && $("chooser").dataset.mode === "continue"){ hideChooser(); return true; }
  return false;
};

function showAbout(){
  openDlg(
    `<div class="sheet-title" style="text-align:center">앱 정보</div>` +
    `<div class="about">묵주기도<small>버전 ${VERSION}${NATIVE && NATIVE.versionCode ? " · 빌드 " + NATIVE.versionCode() : ""}</small></div>` +
    `<div class="about">만든 사람<small>재T (JayT)</small></div>` +
    `<div class="about">사용 범위<small>광고와 회원가입 없이 무료로 쓰는 개인 신앙생활용 앱입니다. 달력 기록과 설정은 이 기기 안에만 보관하며 서버로 보내지 않습니다. 성화는 인터넷에서 불러오며, 출처는 설정 화면 맨 아래에 있습니다.</small></div>` +
    `<button class="btn link" data-dlg="close">닫기</button>`);
}
$("setBackup").addEventListener("click", () => { $("settings").classList.add("hidden"); showBackup(); });
$("setPreload").addEventListener("click", () => { $("settings").classList.add("hidden"); preloadAll(); });
$("setInstall").addEventListener("click", () => { $("settings").classList.add("hidden"); doInstall(); });
$("setUpdate").addEventListener("click", () => { $("settings").classList.add("hidden"); checkUpdate(true); });
$("setAbout").addEventListener("click", () => { $("settings").classList.add("hidden"); showAbout(); });

/* ───────── 시작 ───────── */
applyLook();
if(sess && sess.day === todayKey() && Array.isArray(sess.sets) && sess.sets.length){
  buildSteps();
  sess.idx = Math.min(sess.idx, steps.length);
  render();
} else {
  sess = null;
}
showChooser("start");
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(() => {});
if(NATIVE) setTimeout(() => checkUpdate(false), 3500);
</script>
